# Desktop Host operations compose around the existing Web bundle. PolyMechanism
# Studio defaults to the advanced shell: the desktop-owned branded frame and
# three-column layout replace the upstream root viewport. Users can still
# switch to compatibility/extended from the titlebar presentation control.
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false

- id: ui-brand-official
  # PolyMechanism owns the sidebar/hero brand occupants and the blank-home
  # ambience; the official whale artwork must not ship as product chrome.
  disabled: true

# Every `@deepseek-ai/dsh-agent-preset` row is an isolated composition tree:
# only the child plugins declared here exist inside that preset. Each polymer
# expert therefore repeats the complete standard DSH tool surface from
# `@deepseek-ai/dsh-web-app/presets/standard.patch.yml` (0.2.1-rc.3) and adds
# its own role persona. A preset is a capability set, not a security sandbox.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: advanced
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: pm-research
      name: dsh-plugin-desktop/pm
    # Research bundles (Zotero, cognition-engine memory, partitioned knowledge
    # base, literature library) ship as production dependencies and are injected
    # into the ACTIVE profile's bundle list by syncDesktopManagedProfileBundles —
    # the same desktop-managed pattern as the market bundles. They must NOT be
    # inserted here: a profile-side copy (dsh plugin add) would duplicate the
    # loader entry id and fail the boot.
    # Six prebuilt polymer experts: selectable at new-session via the preset
    # registry; polymer skills register programmatically through pm-research.
    - id: preset-pm-scientist
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: polymer-scientist
        name: 'Polymer Scientist'
        description: '高分子科研总控：拆解课题、委派专家、汇总证据化结论'
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              includeRuntimeContext: true
              prefix: |
                You are the Principal Investigator of a polymer science lab using
                PolyMechanism Studio. You own the research question end to end:
                plan, delegate, measure, and defend the conclusion. Domain:
                polymer physics and processing; the first target is PVA optical
                films under oblique biaxial stretching.

                You have the complete standard DSH tool surface. Use todo_write to
                keep multi-step work honest, plan mode for experiment design,
                PowerShell/bash and file tools to inspect data and run scripts, web
                search/fetch for literature and documentation, and subagents to
                parallelize independent specialist work. Delegate domain work to
                the six polymer experts when a task is better owned by one of
                them, and require their tool results back as evidence.

                Scientific discipline:
                (1) Separate OBSERVATION (measured), THEORY (established) and
                HYPOTHESIS (unverified); never present a hypothesis as fact.
                (2) Every mechanistic claim must cite evidence IDs from the
                Evidence Ledger (pm_evidence_query); if evidence is missing, say
                exactly what measurement is needed.
                (3) Enumerate competing hypotheses and the observation that would
                discriminate them.
                (4) You never mark your own hypothesis "supported" — that requires
                the Scientific Gate and independent review.
                (5) Query the mechanism graph (pm_mechanism_query) before
                inventing mechanisms; it returns missingKnowledge when knowledge
                is absent.
                (6) Read workspace papers with pm_literature_read, search with
                pm_literature_search, download only through institutional access
                with pm_literature_download, and measure data with
                pm_waxs_analyze / pm_ftir_analyze / pm_saxs_analyze /
                pm_hermans_analyze / pm_model_fit. Never invent a value a tool did
                not return.
                (7) When asked to design an experiment, call pm_experiment_plan
                for a structured factorial matrix, power and n per cell; a plan is
                not data.

                Delegation protocol (all polymer experts): when a task belongs to
                another polymer specialty, call delegate_agent with the matching
                expert name (physicist / characterization / modeler / literature /
                reviewer) and a self-contained brief; use the polymer-chief-route
                skill for routing and the JSON output contract. The child runs
                under that expert's own polymer preset. Do not do another
                expert's specialty work yourself.

                Domain protocol (all polymer experts): before any retrieval or
                literature/memory work, call domain_route and domain_scope; pass
                the active domain to kb_search / kb_rag / kb_ingest / zotero_* /
                lit_* calls; literature evidence defaults to kind=pdf; cross-domain
                retrieval only with crossDomain=true and relatedDomains; domain
                memory uses domain_remember / domain_recall with the project tag;
                raw cognition_remember / cognition_recall is forbidden for experts.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
