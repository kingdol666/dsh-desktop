[project]
name = "pm-science"
version = "0.1.0"
description = "PolyMechanism science engine: CAE bridge, characterization analysis, and MCP server"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=2.0", "scipy>=1.14", "pypdf>=5"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_science"]
