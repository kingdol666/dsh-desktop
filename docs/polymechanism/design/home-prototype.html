<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F4F6FA" />
<title>PolyMechanism Studio — Home Prototype</title>
<style>
  /* ============================================================
     PolyMechanism Studio — design tokens (Figma handoff v1)
     Frame: 1600 × 1000 · 8pt grid · light + dark
     ============================================================ */
  :root {
    color-scheme: light;
    --pm-font: "Inter", "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --pm-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

    --bg-app: #f4f6fa;
    --bg-surface: #ffffff;
    --bg-sidebar: #fafbfd;
    --bg-subtle: #f1f4f9;
    --bg-hover: #eef1f7;
    --bg-elevated: #ffffff;

    --text-1: #12151c;
    --text-2: #596174;
    --text-3: #667085;
    --text-inverse: #ffffff;

    --border: #e5e8ef;
    --border-strong: #d7dce7;

    --brand: #4f6bff;
    --brand-strong: #3d53d9;
    --brand-soft: #edf0ff;
    --brand-ink: #2f3fa8;
    --brand-glow: rgba(79, 107, 255, 0.16);

    --teal: #0e9f87;
    --teal-soft: #e5f6f1;
    --amber: #b07610;
    --amber-soft: #fbf2df;
    --rose: #c94b5b;
    --violet: #7a66e0;

    --shadow-card: 0 1px 2px rgba(18, 21, 28, 0.04), 0 10px 28px rgba(18, 21, 28, 0.07);
    --shadow-float: 0 12px 40px rgba(18, 21, 28, 0.14);

    --radius-sm: 7px;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-xl: 10px;
  }

  body.theme-dark {
    color-scheme: dark;
    --bg-app: #090c12;
    --bg-surface: #10151e;
    --bg-sidebar: #0b0f16;
    --bg-subtle: #141a24;
    --bg-hover: #182030;
    --bg-elevated: #151b26;

    --text-1: #e9edf6;
    --text-2: #9aa4b8;
    --text-3: #7d889d;

    --border: #1d2431;
    --border-strong: #2a3242;

    --brand: #6e86ff;
    --brand-strong: #8b9dff;
    --brand-soft: #171f3d;
    --brand-ink: #b7c2ff;
    --brand-glow: rgba(110, 134, 255, 0.2);

    --teal: #2cc3a8;
    --teal-soft: #0f2b26;
    --amber: #e0ac4d;
    --amber-soft: #2c2314;
    --rose: #ef7180;
    --violet: #a392ff;

    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25), 0 12px 32px rgba(0, 0, 0, 0.35);
    --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg-app);
    color: var(--text-1);
    font-family: var(--pm-font);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-numeric: tabular-nums;
    transition: background-color 240ms ease, color 240ms ease;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }
  .icon { width: 16px; height: 16px; stroke-width: 1.75; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  .skip {
    position: fixed; top: -44px; left: 16px; z-index: 2147483647;
    padding: 8px 12px; border-radius: 8px;
    background: var(--bg-surface); color: var(--text-1);
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-float);
    font-size: 12.5px; text-decoration: none;
  }
  .skip:focus-visible { top: 8px; }

  /* ============ Window frame ============ */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 1120px;
    background: var(--bg-app);
  }

  .titlebar {
    position: relative;
    display: flex;
    align-items: center;
    flex: none;
    height: 38px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg-app) 86%, var(--bg-surface));
    user-select: none;
  }
  .titlebar-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .remote {
    display: inline-flex; align-items: center; gap: 7px;
    height: 26px; padding: 0 9px; margin-right: 4px;
    border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 11.5px;
  }
  .remote:hover { background: var(--bg-hover); color: var(--text-1); }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 16%, transparent);
  }
  .tb-icon {
    display: inline-grid; place-items: center;
    width: 28px; height: 28px; border-radius: var(--radius-sm);
    color: var(--text-2);
  }
  .tb-icon:hover { background: var(--bg-hover); color: var(--text-1); }

  .titlebar-center {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 9px;
    pointer-events: none; white-space: nowrap;
  }
  .tb-lockup { display: inline-flex; align-items: center; gap: 7px; }
  .tb-lockup .logo { width: 17px; height: 17px; color: var(--brand); }
  .tb-product { font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em; }
  .tb-version {
    padding: 1px 6px; border-radius: 5px;
    color: var(--text-3); font-family: var(--pm-mono); font-size: 11px;
    background: var(--bg-subtle);
  }
  .tb-mode {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-2); font-size: 11px;
    background: var(--bg-surface);
    pointer-events: auto;
  }
  .tb-mode .status-dot { width: 5px; height: 5px; box-shadow: none; }

  .titlebar-right {
    display: flex; align-items: center; gap: 2px;
    margin-left: auto;
  }
  .win-btn {
    display: grid; place-items: center;
    width: 34px; height: 28px; border-radius: 6px;
    color: var(--text-2);
  }
  .win-btn:hover { background: var(--bg-hover); color: var(--text-1); }
  .win-btn.close:hover { background: #e5484d; color: #fff; }

  /* ============ Body ============ */
  .shell {
    display: grid;
    grid-template-columns: 288px minmax(0, 1fr);
    flex: 1;
    min-height: 0;
  }

  /* ============ Sidebar ============ */
  .sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--border);
    background: var(--bg-sidebar);
  }
  .brand-row {
    display: flex; align-items: center; gap: 9px;
    flex: none;
    height: 54px;
    padding: 0 18px;
  }
  .brand-mark { width: 26px; height: 26px; color: var(--brand); flex: none; }
  .brand-word { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .brand-name {
    font-size: 15px; font-weight: 650; letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .brand-tag {
    padding: 1px 5px 0;
    border: 1px solid color-mix(in srgb, var(--brand) 34%, transparent);
    border-radius: 4px;
    color: var(--brand-ink);
    background: var(--brand-soft);
    font-family: var(--pm-mono);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  }
  .brand-collapse { margin-left: auto; color: var(--text-3); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; }
  .brand-collapse:hover { background: var(--bg-hover); color: var(--text-1); }

  .new-session {
    display: flex; align-items: center; gap: 9px;
    flex: none;
    height: 38px;
    margin: 4px 14px 14px;
    padding: 0 12px;
    border: 1px solid color-mix(in srgb, var(--brand) 28%, var(--border));
    border-radius: var(--radius-md);
    background: linear-gradient(180deg, color-mix(in srgb, var(--brand) 10%, var(--bg-surface)), color-mix(in srgb, var(--brand) 4%, var(--bg-surface)));
    color: var(--brand-ink);
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset;
    transition: border-color 140ms ease, background-color 140ms ease;
  }
  .new-session:hover { border-color: color-mix(in srgb, var(--brand) 52%, var(--border)); background: color-mix(in srgb, var(--brand) 12%, var(--bg-surface)); }
  .new-session .kbd {
    margin-left: auto;
    font-family: var(--pm-mono); font-size: 11px; font-weight: 500;
    color: color-mix(in srgb, var(--brand) 70%, var(--text-2));
    padding: 1px 5px; border-radius: 4px;
    background: color-mix(in srgb, var(--brand) 9%, transparent);
  }

  .nav { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 9px;
    border-radius: var(--radius-sm);
    color: var(--text-2);
    font-size: 12.5px;
    text-align: left;
    position: relative;
  }
  .nav-item .icon { color: var(--text-3); }
  .nav-item:hover { background: var(--bg-hover); color: var(--text-1); }
  .nav-item:hover .icon { color: var(--text-1); }
  .nav-item[aria-current="page"] {
    color: var(--text-1); font-weight: 600;
    background: var(--bg-surface);
    box-shadow: 0 1px 2px rgba(18, 21, 28, 0.05), 0 0 0 1px var(--border);
  }
  .nav-item[aria-current="page"]::before {
    content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px;
    width: 2px; border-radius: 2px; background: var(--brand);
  }
  .nav-item[aria-current="page"] .icon { color: var(--brand); }
  .nav-badge {
    margin-left: auto;
    min-width: 18px; height: 17px; padding: 0 5px;
    display: inline-grid; place-items: center;
    border-radius: 999px;
    background: color-mix(in srgb, var(--violet) 14%, transparent);
    color: var(--violet);
    font-size: 11px; font-weight: 650;
  }

  .nav-sep { height: 1px; margin: 10px 16px; background: var(--border); flex: none; }

  .side-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 10px 8px; scrollbar-width: thin; }
  .side-scroll::-webkit-scrollbar { width: 8px; }
  .side-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  .side-scroll:hover::-webkit-scrollbar-thumb { background: var(--border-strong); background-clip: content-box; }

  .section-head {
    display: flex; align-items: center; gap: 6px;
    height: 30px; margin-top: 6px; padding: 0 9px;
    color: var(--text-3);
    font-size: 11px; font-weight: 650; letter-spacing: 0.11em; text-transform: uppercase;
  }
  .section-head button { margin-left: auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; color: var(--text-3); }
  .section-head button:hover { background: var(--bg-hover); color: var(--text-1); }

  .project-head {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 32px; padding: 0 9px;
    border-radius: var(--radius-sm);
    color: var(--text-1); font-size: 12.5px; font-weight: 550;
    text-align: left;
  }
  .project-head:hover { background: var(--bg-hover); }
  .project-head .icon { color: var(--brand); flex: none; }
  .project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-meta { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--text-3); font-size: 11px; }
  .project-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); }

  .session-list { display: flex; flex-direction: column; gap: 1px; padding: 1px 0 6px 16px; position: relative; }
  .session-list::before { content: ""; position: absolute; left: 12px; top: 3px; bottom: 9px; width: 1px; background: var(--border); }
  .session {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 8px;
    border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 12px; text-align: left;
  }
  .session:hover { background: var(--bg-hover); color: var(--text-1); }
  .session[aria-current="true"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 550; }
  .session[aria-current="true"]::before {
    content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px;
    width: 2px; border-radius: 2px; background: var(--brand);
  }
  .session-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-time { margin-left: auto; flex: none; color: var(--text-3); font-size: 11px; }
  .session[aria-current="true"] .session-time { color: color-mix(in srgb, var(--brand) 65%, var(--text-3)); }

  .utility { padding: 6px 10px 8px; flex: none; }
  .side-footer {
    display: flex; align-items: center; gap: 8px;
    flex: none;
    height: 44px; margin: 0 10px 8px; padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    color: var(--text-2); font-size: 11.5px;
  }
  .side-footer .status-dot { flex: none; }
  .side-footer .model { font-family: var(--pm-mono); font-size: 11px; color: var(--text-3); }
  .side-footer button { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--text-3); }
  .side-footer button:hover { background: var(--bg-hover); color: var(--text-1); }

  /* ============ Main ============ */
  .main {
    position: relative;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    overflow: hidden;
    background:
      radial-gradient(900px 420px at 50% -8%, var(--brand-glow), transparent 62%),
      var(--bg-surface);
  }
  .main::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--text-3) 22%, transparent) 1px, transparent 0);
    background-size: 22px 22px;
    opacity: 0.32;
    -webkit-mask-image: radial-gradient(760px 460px at 50% 0%, #000 0%, transparent 72%);
            mask-image: radial-gradient(760px 460px at 50% 0%, #000 0%, transparent 72%);
    pointer-events: none;
  }
  .lattice { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lattice svg {
    position: absolute; top: -64px; right: -130px;
    width: 520px; height: 390px;
    color: var(--border-strong);
    opacity: 0.38;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .lattice .node { fill: var(--bg-surface); stroke: var(--brand); }
  .lattice .bond { fill: none; stroke: currentColor; stroke-width: 1; }
  .lattice .ring { fill: none; stroke: currentColor; stroke-width: 1; }
  .lattice .accent { fill: color-mix(in srgb, var(--brand) 18%, transparent); stroke: var(--brand); }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-14px, 12px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lattice svg { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }

  .main-header {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 10px;
    flex: none;
    height: 52px; padding: 0 22px 0 26px;
  }
  .crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; }
  .crumb { color: var(--text-2); }
  .crumb-sep { color: var(--text-3); }
  .crumb-current { color: var(--text-1); font-weight: 600; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .cmd-btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 28px; padding: 0 8px 0 9px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 11.5px;
    background: color-mix(in srgb, var(--bg-surface) 80%, transparent);
  }
  .cmd-btn:hover { border-color: var(--border-strong); color: var(--text-1); background: var(--bg-surface); }
  .cmd-btn .kbd {
    font-family: var(--pm-mono); font-size: 11px; color: var(--text-3);
    padding: 1px 4px; border-radius: 3px; background: var(--bg-subtle);
  }
  .avatar {
    width: 26px; height: 26px; margin-left: 2px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--brand), color-mix(in srgb, var(--violet) 55%, var(--brand)));
    color: #fff; font-size: 11px; font-weight: 650;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 30%, transparent);
  }

  .home {
    position: relative; z-index: 1;
    flex: 1; min-height: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(20px, 4vh, 48px) 32px clamp(24px, 4vh, 48px);
  }
  .home-inner { width: min(860px, 100%); display: flex; flex-direction: column; }

  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--text-3);
    font-family: var(--pm-mono); font-size: 11px; font-weight: 550;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .eyebrow .rule { width: 22px; height: 1px; background: var(--border-strong); }
  .eyebrow .protocol {
    color: var(--brand-ink);
    background: var(--brand-soft);
    border: 1px solid color-mix(in srgb, var(--brand) 22%, transparent);
    border-radius: 999px;
    padding: 2px 7px;
    letter-spacing: 0.12em;
  }

  .headline {
    margin: 15px 0 0;
    text-align: center;
    font-size: clamp(30px, 3.2vw, 42px);
    line-height: 1.16;
    font-weight: 640;
    letter-spacing: -0.028em;
    text-wrap: balance;
  }
  .headline .accent {
    color: var(--brand);
    position: relative;
  }
  .headline .accent::after {
    content: ""; position: absolute; left: 2px; right: 2px; bottom: 3px;
    height: 5px; border-radius: 3px;
    background: color-mix(in srgb, var(--brand) 16%, transparent);
    z-index: -1;
  }
  .subline {
    margin: 12px auto 0;
    max-width: 560px;
    text-align: center;
    color: var(--text-2);
    font-size: 13.5px;
    line-height: 1.6;
    text-wrap: pretty;
  }
  .subline .sep { margin: 0 7px; color: var(--text-3); }

  .station {
    display: flex; align-items: center; gap: 10px;
    margin: 26px 0 14px;
  }
  .station-label {
    flex: none;
    color: var(--text-3);
    font-family: var(--pm-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.13em;
  }
  .experts { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .expert {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 9px 0 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-surface);
    color: var(--text-2);
    font-size: 11.5px; white-space: nowrap;
    transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease, transform 140ms ease;
  }
  .expert .icon { width: 14px; height: 14px; color: var(--text-3); }
  .expert:hover { border-color: var(--border-strong); color: var(--text-1); transform: translateY(-1px); }
  .expert[aria-pressed="true"] {
    border-color: color-mix(in srgb, var(--brand) 46%, var(--border));
    background: var(--brand-soft);
    color: var(--brand-ink);
    font-weight: 600;
  }
  .expert[aria-pressed="true"] .icon { color: var(--brand); }
  .station-spacer { flex: 1; }
  .ready {
    display: inline-flex; align-items: center; gap: 6px;
    flex: none;
    color: var(--text-3); font-size: 11px;
  }
  .ready .status-dot { width: 5px; height: 5px; box-shadow: none; }

  /* ============ Composer ============ */
  .composer {
    position: relative;
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    background: var(--bg-surface);
    box-shadow: var(--shadow-card);
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }
  .composer:focus-within {
    border-color: color-mix(in srgb, var(--brand) 52%, var(--border));
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 10%, transparent), var(--shadow-card);
  }
  .composer-context {
    display: flex; align-items: center; gap: 7px;
    padding: 12px 14px 0;
  }
  .ctx-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 8px;
    border-radius: 6px;
    background: var(--bg-subtle);
    color: var(--text-2);
    font-size: 11px;
  }
  .ctx-chip .icon { width: 13px; height: 13px; color: var(--text-3); }
  .ctx-chip strong { color: var(--text-1); font-weight: 550; }
  .ctx-chip.tint { background: var(--brand-soft); color: var(--brand-ink); }
  .ctx-chip.tint .icon { color: var(--brand); }
  .composer textarea {
    display: block;
    width: 100%;
    height: 74px;
    padding: 10px 16px 4px;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text-1);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer-tools {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 10px 10px;
  }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 8px;
    border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 11.5px;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-1); }
  .tool-btn .icon { width: 15px; height: 15px; color: var(--text-3); }
  .tool-btn.icon-only { width: 28px; padding: 0; justify-content: center; }
  .composer-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .model-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 8px;
    border-radius: 6px;
    color: var(--text-2); font-size: 11px;
    font-family: var(--pm-mono);
  }
  .model-chip:hover { background: var(--bg-hover); }
  .model-chip .tag {
    padding: 1px 4px; border-radius: 3px;
    background: var(--brand-soft); color: var(--brand-ink);
    font-size: 11px; letter-spacing: 0.04em;
  }
  .send {
    display: grid; place-items: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--brand) 35%, transparent);
    transition: background-color 140ms ease, transform 140ms ease;
  }
  .send:hover { background: var(--brand-strong); transform: translateY(-1px); }
  .send:active { transform: translateY(0); }
  .send .icon { width: 16px; height: 16px; stroke-width: 2; }

  /* ============ Quick actions ============ */
  .quick-head {
    display: flex; align-items: center; gap: 8px;
    margin: 18px 2px 8px;
    color: var(--text-3);
    font-size: 11px;
  }
  .quick-head .line { flex: 1; height: 1px; background: var(--border); }
  .quick-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .quick {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--bg-surface) 72%, transparent);
    text-align: left;
    transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
  }
  .quick:hover {
    border-color: color-mix(in srgb, var(--brand) 30%, var(--border));
    background: var(--bg-surface);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(18, 21, 28, 0.06);
  }
  .quick-icon {
    display: grid; place-items: center;
    flex: none;
    width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--brand-soft);
    color: var(--brand);
  }
  .quick-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .quick-title { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-1); white-space: nowrap; }
  .quick-desc { display: block; font-size: 11px; line-height: 1.4; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-kbd { margin-left: auto; align-self: center; color: var(--text-3); font-family: var(--pm-mono); font-size: 11px; }

  /* ============ Pulse ============ */
  .pulse {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px; padding: 0 2px;
    color: var(--text-2);
    font-size: 11px;
  }
  .pulse-label {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-3);
    font-family: var(--pm-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
  }
  .pulse-items { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .pulse-item { display: inline-flex; align-items: baseline; gap: 4px; padding: 0 11px; border-left: 1px solid var(--border); }
  .pulse-item:first-child { border-left: 0; padding-left: 4px; }
  .pulse-value { color: var(--text-1); font-family: var(--pm-mono); font-size: 11.5px; font-weight: 600; }
  .pulse-value.warn { color: var(--amber); }
  .pulse-link { margin-left: auto; color: var(--brand-ink); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
  .pulse-link:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ============ Micro interactions ============ */
  .toast {
    position: fixed; left: 50%; bottom: 26px;
    transform: translate(-50%, 12px);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-1);
    box-shadow: var(--shadow-float);
    font-size: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .theme-toggle { margin-left: 4px; }

  @media (max-width: 1180px) {
    .shell { grid-template-columns: 252px minmax(0, 1fr); }
    .station-label, .ready { display: none; }
  }
</style>

<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') {
    document.body.classList.add('theme-dark')
    document.documentElement.style.colorScheme = 'dark'
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#090c12')
    document.getElementById('themeToggle').setAttribute('aria-pressed', 'true')
  }

  const toast = document.getElementById('toast')
  let toastTimer
  function say(message) {
    toast.textContent = message
    toast.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800)
  }

  // Experts: one active station, mirrored into the composer preset chip.
  const presetNames = {
    'polymer-scientist': '高分子科学家',
    'polymer-physicist': '高分子物理',
    'polymer-characterization': '表征专家',
    'polymer-modeler': '建模专家',
    'polymer-literature': '文献专家',
    'polymer-reviewer': '独立评审',
  }
  const prompt = document.getElementById('prompt')
  const presetChip = document.getElementById('presetChip')
  document.querySelectorAll('.expert').forEach((button) => {
    button.addEventListener('click', () => {
      document.querySelectorAll('.expert').forEach(other => other.setAttribute('aria-pressed', 'false'))
      button.setAttribute('aria-pressed', 'true')
      const id = button.dataset.preset
      presetChip.lastChild.textContent = presetNames[id]
      prompt.placeholder = `以${presetNames[id]}身份开始：描述课题、贴上表征数据，或让我设计判别实验…`
      prompt.focus()
      say(`已切换专家：${presetNames[id]}`)
    })
  })

  // Quick starts fill the composer instead of sending — the user keeps control.
  document.querySelectorAll('.quick').forEach((button) => {
    button.addEventListener('click', () => {
      prompt.value = button.dataset.prompt
      prompt.focus()
      prompt.setSelectionRange(prompt.value.length, prompt.value.length)
      say('已填入输入框，可继续修改')
    })
  })

  // Theme preview (the app itself follows the system preference).
  const toggle = document.getElementById('themeToggle')
  toggle.addEventListener('click', () => {
    const dark = document.body.classList.toggle('theme-dark')
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
    toggle.setAttribute('aria-pressed', String(dark))
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#090c12' : '#F4F6FA')
  })

  // Keep the artboard honest: submitting shows that the design is a prototype.
  document.getElementById('composer').addEventListener('submit', (event) => {
    event.preventDefault()
    say(prompt.value.trim() === '' ? '先描述一个研究任务' : '原型演示：真实客户端会启动所选专家')
  })
  document.getElementById('newSession').addEventListener('click', () => {
    prompt.value = ''
    prompt.focus()
  })

  // Sidebar session selection (visual only).
  document.querySelectorAll('.session').forEach((row) => {
    row.addEventListener('click', () => {
      document.querySelectorAll('.session').forEach(other => other.removeAttribute('aria-current'))
      row.setAttribute('aria-current', 'true')
    })
  })
</script>

</html>
