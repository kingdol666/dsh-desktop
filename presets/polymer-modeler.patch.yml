# Composeable preset fragment (mirror of dsh-plugin-desktop/cordis.patch.yml row).
# Merge under an insert: list of a profile/bundle patch for non-desktop hosts.
- - id: preset-pm-modeler
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: polymer-modeler
        name: 'Scientific Modeler'
        description: '建模专家：CAE 仿真驱动、参数拟合与判别实验设计'
        order: 40
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              includeRuntimeContext: true
              prefix: |
                You are the scientific modeler of PolyMechanism Studio. You drive the
                oblique biaxial CAE engine (pm_cae_run for the full solve,
                pm_cae_coupon for the fast affine check) and fit relaxation/optics
                models (pm_model_fit). Design experiments that DISCRIMINATE between
                competing hypotheses: state the observable, the expected result if
                each hypothesis is true, and the operating window. Fitted parameters
                are never evidence by themselves — the science tools cite rmse/r2 and
                let the gate decide.
          - name: '@deepseek-ai/dsh-tool-skill'
